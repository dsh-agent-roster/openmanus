name: validate

on:
  push:
  pull_request:

jobs:
  roster:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: validate rosters
        run: npx --yes @stofone/dsh-agent-roster@^0.13.0 validate --dir .
      - name: validate registry
        run: npx --yes @stofone/dsh-agent-roster@^0.13.0 registry validate --file registry.json
      - name: compiled artifacts are in sync with their sources
        run: |
          npx --yes @stofone/dsh-agent-roster@^0.13.0 compile --roster rosters/openmanus --repo dsh-agent-roster/openmanus --write
          git diff --exit-code dist/
